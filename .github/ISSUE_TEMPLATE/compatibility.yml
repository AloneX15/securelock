name: Compatibility issue
description: A crash or broken behavior when SecureLock is used together with another mod
labels: ["compat"]
body:
  - type: markdown
    attributes:
      value: |
        Target: a fix in less than 72 hours for crashes caused by SecureLock.
        Meanwhile you can turn off the affected protection with `compat.disable` in `config/securelock.json` (see `/securelock debug`).
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: "MC 26.3, SecureLock 1.0.0, Loader 0.19.5, Fabric API 0.161.0+26.3"
    validations:
      required: true
  - type: textarea
    id: mods
    attributes:
      label: Mod list
      description: The other mod(s) involved with their versions, or the full modpack (name + version)
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happens?
    validations:
      required: true
  - type: textarea
    id: debug
    attributes:
      label: Output of /securelock debug
  - type: textarea
    id: log
    attributes:
      label: Log / crash report
      description: Link to latest.log or the crash report (mclo.gs, gist)
    validations:
      required: true
