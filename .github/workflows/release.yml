name: Release

# Publica un jar por versión de Minecraft en GitHub, Modrinth y CurseForge al crear un tag vX.Y.Z.
# Configura en el repositorio:
#   secrets.MODRINTH_TOKEN, secrets.CURSEFORGE_TOKEN
#   vars.MODRINTH_ID, vars.CURSEFORGE_ID  (ids de los proyectos, cuando existan)

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    name: Publish MC ${{ matrix.minecraft }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: "26.1.2"
            game-versions: |
              26.1
              26.1.1
              26.1.2
          - minecraft: "26.2"
            game-versions: |
              26.2
          - minecraft: "26.3"
            game-versions: |
              26.3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew :${{ matrix.minecraft }}:build :${{ matrix.minecraft }}:runGameTest --stacktrace

      - name: Publish
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ vars.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          files: versions/${{ matrix.minecraft }}/build/libs/!(*-sources).jar
          name: SecureLock ${{ github.ref_name }} for MC ${{ matrix.minecraft }}
          version: ${{ github.ref_name }}+mc${{ matrix.minecraft }}
          version-type: release
          changelog-file: CHANGELOG.md
          loaders: fabric
          game-versions: ${{ matrix.game-versions }}
          java: 25
          dependencies: |
            fabric-api(required)
            jade(optional)
            luckperms(optional)
            open-parties-and-claims(optional)
            flan(optional)
