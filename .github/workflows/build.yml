name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: MC ${{ matrix.minecraft }}${{ matrix.compat && ' (compat pack)' || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        minecraft: ["26.1.2", "26.2", "26.3"]
        compat: [false, true]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and unit tests
        if: ${{ !matrix.compat }}
        run: ./gradlew :${{ matrix.minecraft }}:build --stacktrace

      - name: Gametests (bypass suite)
        run: ./gradlew :${{ matrix.minecraft }}:runGameTest ${{ matrix.compat && '-PcompatPack' || '' }} --stacktrace

      - name: Upload jar
        if: ${{ !matrix.compat }}
        uses: actions/upload-artifact@v4
        with:
          name: securelock-mc${{ matrix.minecraft }}
          path: versions/${{ matrix.minecraft }}/build/libs/*.jar
          if-no-files-found: error

      - name: Upload test reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: reports-mc${{ matrix.minecraft }}${{ matrix.compat && '-compat' || '' }}
          path: |
            versions/${{ matrix.minecraft }}/build/reports/
            versions/${{ matrix.minecraft }}/build/run/gameTest/logs/
          if-no-files-found: ignore

  client:
    name: Client test MC ${{ matrix.minecraft }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        minecraft: ["26.1.2", "26.2", "26.3"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Client gametest (renders every block and screen, restarts the world)
        run: xvfb-run -a ./gradlew :${{ matrix.minecraft }}:runClientGameTest --stacktrace

      - name: Upload screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-mc${{ matrix.minecraft }}
          path: versions/${{ matrix.minecraft }}/build/run/clientGameTest/screenshots/
          if-no-files-found: ignore
